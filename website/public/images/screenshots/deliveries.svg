<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#090D16"/>
  
  <!-- Status Bar -->
  <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(320, 26)">
    <rect x="0" y="8" width="3" height="4" rx="1" fill="#F8FAFC"/>
    <rect x="5" y="6" width="3" height="6" rx="1" fill="#F8FAFC"/>
    <rect x="10" y="4" width="3" height="8" rx="1" fill="#F8FAFC"/>
    <rect x="15" y="1" width="3" height="11" rx="1" fill="#F8FAFC"/>
    <rect x="24" y="2" width="20" height="10" rx="3" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#10B981"/>
  </g>

  <!-- Top Bar -->
  <g transform="translate(20, 60)">
    <rect width="350" height="54" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="20" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Driver Task Queue</text>
    <rect x="230" y="12" width="105" height="30" rx="15" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <circle cx="244" cy="27" r="3.5" fill="#10B981"/>
    <text x="254" y="31" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">GPS ACTIVE</text>
  </g>

  <!-- Trip Header -->
  <g transform="translate(20, 126)">
    <rect width="350" height="68" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="18" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="700">ACTIVE TRIP · ROUTE 7-SOUTH</text>
    <text x="18" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Vehicle: Van KA-04-E-2041</text>
    <rect x="250" y="14" width="86" height="40" rx="12" fill="#10B981"/>
    <text x="293" y="38" text-anchor="middle" fill="#090D16" font-family="sans-serif" font-size="12" font-weight="800">START</text>
  </g>

  <!-- Deliveries Section Title -->
  <g transform="translate(20, 208)">
    <text x="2" y="14" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">Next Stops (6 Orders)</text>

    <!-- Priority Card 1 -->
    <g transform="translate(0, 24)">
      <rect width="350" height="200" rx="20" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
      <rect x="18" y="16" width="68" height="24" rx="8" fill="#10B981" fill-opacity="0.2"/>
      <text x="52" y="32" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="800">STOP #1</text>
      <text x="332" y="32" text-anchor="end" fill="#9CA3AF" font-family="sans-serif" font-size="11">ETA: 4m (1.2 km)</text>
      
      <text x="18" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">Prestige High-Tech Park</text>
      <text x="18" y="86" fill="#9CA3AF" font-family="sans-serif" font-size="12">Tower 3, Reception · Mr. Arun (+91 98450)</text>

      <g transform="translate(18, 102)">
        <rect width="140" height="32" rx="8" fill="#1F2937"/>
        <text x="12" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">📦 15 Cans (20L)</text>
        <rect x="148" y="0" width="166" height="32" rx="8" fill="#1F2937"/>
        <text x="160" y="21" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="600">↺ 15 Empties to Collect</text>
      </g>

      <!-- Buttons -->
      <g transform="translate(18, 146)">
        <rect width="138" height="42" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="69" y="26" text-anchor="middle" fill="#E5E7EB" font-family="sans-serif" font-size="12" font-weight="600">📞 Call Customer</text>

        <rect x="148" y="0" width="166" height="42" rx="12" fill="#10B981"/>
        <text x="231" y="26" text-anchor="middle" fill="#090D16" font-family="sans-serif" font-size="13" font-weight="800">✓ Confirm Drop-off</text>
      </g>
    </g>

    <!-- Stop 2 -->
    <g transform="translate(0, 236)">
      <rect width="350" height="120" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <rect x="18" y="16" width="68" height="24" rx="8" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="52" y="32" text-anchor="middle" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="800">STOP #2</text>
      <text x="332" y="32" text-anchor="end" fill="#9CA3AF" font-family="sans-serif" font-size="11">ETA: 18m (4.8 km)</text>
      
      <text x="18" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Silicon Oasis Villa #42</text>
      <text x="18" y="86" fill="#9CA3AF" font-family="sans-serif" font-size="12">4 Cans · Collect ₹160 Cash on Delivery</text>
      <text x="18" y="106" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">Drop at security gate if unavailable</text>
    </g>

    <!-- Stop 3 -->
    <g transform="translate(0, 368)">
      <rect width="350" height="120" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <rect x="18" y="16" width="68" height="24" rx="8" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="52" y="32" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="11" font-weight="800">STOP #3</text>
      <text x="332" y="32" text-anchor="end" fill="#9CA3AF" font-family="sans-serif" font-size="11">ETA: 35m</text>
      
