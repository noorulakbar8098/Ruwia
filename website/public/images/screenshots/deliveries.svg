  <!-- Bottom App Navigation Bar -->
  <g transform="translate(16, 750)">
    <rect width="358" height="66" rx="24" fill="#0B101B" stroke="#1F2937" stroke-width="1.5"/>
    <g transform="translate(36, 12)">
