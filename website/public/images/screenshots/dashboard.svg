<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen Canvas -->
  <rect width="390" height="844" fill="#090D16"/>
  
  <!-- Subtle Gradient Background Glow -->
  <circle cx="195" cy="180" r="160" fill="#10B981" fill-opacity="0.08"/>
  <circle cx="340" cy="400" r="120" fill="#3B82F6" fill-opacity="0.05"/>
  
  <!-- Status Bar Area (leaving space for notch at top) -->
  <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(320, 26)">
    <!-- Signal Bars -->
    <rect x="0" y="8" width="3" height="4" rx="1" fill="#F8FAFC"/>
    <rect x="5" y="6" width="3" height="6" rx="1" fill="#F8FAFC"/>
    <rect x="10" y="4" width="3" height="8" rx="1" fill="#F8FAFC"/>
    <rect x="15" y="1" width="3" height="11" rx="1" fill="#F8FAFC"/>
    <!-- Battery -->
    <rect x="24" y="2" width="20" height="10" rx="3" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#10B981"/>
    <path d="M45 5.5 C45.5 5.5, 46 6, 46 7 L46 7 C46 8, 45.5 8.5, 45 8.5" stroke="#F8FAFC" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 60)">
    <rect width="350" height="54" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <!-- Logo Circle -->
    <circle cx="30" cy="27" r="15" fill="#10B981" fill-opacity="0.2"/>
    <path d="M30 18 C30 18, 23 27, 23 30 C23 33.86 26.14 37 30 37 C33.86 37 37 33.86 37 30 C37 27, 30 18, 30 18 Z" fill="#10B981"/>
    <text x="54" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Ruwia Operations</text>
    <circle cx="58" cy="36" r="3" fill="#10B981"/>
    <text x="66" y="39" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">LIVE SYNC · MAIN HUB</text>
    
    <!-- User Avatar & Badge -->
    <circle cx="320" cy="27" r="14" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="320" y="31" text-anchor="middle" fill="#E5E7EB" font-family="sans-serif" font-size="11" font-weight="700">AK</text>
  </g>

  <!-- Revenue KPI Card -->
  <g transform="translate(20, 126)">
    <rect width="350" height="120" rx="20" fill="url(#heroRevenueGrad)" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="20" y="28" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TODAY'S REVENUE</text>
    <rect x="265" y="14" width="65" height="22" rx="11" fill="#10B981" fill-opacity="0.2"/>
    <text x="297" y="29" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="800">▲ +18.4%</text>
    <text x="20" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="800">₹14,850</text>
    <text x="20" y="98" fill="#9CA3AF" font-family="sans-serif" font-size="11">48 Completed Orders · 280 Cans Dispatched</text>
  </g>

  <!-- Double Metric Tiles -->
  <!-- Tile 1: Deliveries -->
  <g transform="translate(20, 258)">
    <rect width="168" height="106" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="16" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">ACTIVE DELIVERIES</text>
    <text x="16" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="800">18<tspan fill="#6B7280" font-size="16"> / 24</tspan></text>
    <!-- Progress Bar -->
    <rect x="16" y="80" width="136" height="6" rx="3" fill="#1F2937"/>
    <rect x="16" y="80" width="102" height="6" rx="3" fill="#10B981"/>
    <text x="16" y="97" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600">75% Route Finished</text>
  </g>

  <!-- Tile 2: Stock -->
  <g transform="translate(202, 258)">
    <rect width="168" height="106" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="16" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">FULL INVENTORY</text>
    <text x="16" y="66" fill="#34D399" font-family="sans-serif" font-size="28" font-weight="800">342<tspan fill="#6B7280" font-size="13"> Cans</tspan></text>
    <rect x="16" y="80" width="136" height="6" rx="3" fill="#1F2937"/>
    <rect x="16" y="80" width="85" height="6" rx="3" fill="#F59E0B"/>
    <text x="16" y="97" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="600">86 Empty Returns</text>
  </g>

  <!-- Quick Action Chips -->
  <g transform="translate(20, 376)">
    <text x="2" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">Quick Actions</text>
    
    <!-- Action 1: New Sale -->
    <rect x="0" y="26" width="78" height="60" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <circle cx="39" cy="48" r="11" fill="#10B981" fill-opacity="0.15"/>
    <path d="M35 48 H43 M39 44 V52" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <text x="39" y="73" text-anchor="middle" fill="#D1D5DB" font-family="sans-serif" font-size="10" font-weight="600">Sale</text>

    <!-- Action 2: Dispatch -->
    <rect x="88" y="26" width="80" height="60" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <circle cx="128" cy="48" r="11" fill="#3B82F6" fill-opacity="0.15"/>
    <path d="M124 50 L128 45 L132 50" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <text x="128" y="73" text-anchor="middle" fill="#D1D5DB" font-family="sans-serif" font-size="10" font-weight="600">Dispatch</text>

    <!-- Action 3: Can Audit -->
    <rect x="178" y="26" width="82" height="60" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <circle cx="219" cy="48" r="11" fill="#F59E0B" fill-opacity="0.15"/>
    <path d="M214 48 H224" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="219" y="73" text-anchor="middle" fill="#D1D5DB" font-family="sans-serif" font-size="10" font-weight="600">Audit</text>

    <!-- Action 4: Reports -->
    <rect x="270" y="26" width="80" height="60" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <circle cx="310" cy="48" r="11" fill="#8B5CF6" fill-opacity="0.15"/>
    <rect x="306" y="44" width="8" height="8" rx="2" stroke="#8B5CF6" stroke-width="1.8"/>
    <text x="310" y="73" text-anchor="middle" fill="#D1D5DB" font-family="sans-serif" font-size="10" font-weight="600">Ledger</text>
  </g>

  <!-- Live Feed Header -->
  <g transform="translate(20, 482)">
    <text x="2" y="14" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">Live Delivery Activity</text>
    
    <!-- Feed Card 1 -->
    <g transform="translate(0, 24)">
      <rect width="350" height="64" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <circle cx="28" cy="32" r="15" fill="#10B981" fill-opacity="0.15"/>
      <path d="M23 32 L26 35 L33 28" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="26" fill="#F9FAFB" font-family="sans-serif" font-size="13" font-weight="700">Delivered · Royal Palms Apts</text>
      <text x="52" y="45" fill="#9CA3AF" font-family="sans-serif" font-size="11">Driver: Vignesh · 12 Cans · ₹480 Paid</text>
      <text x="330" y="26" text-anchor="end" fill="#6B7280" font-family="sans-serif" font-size="10">2m ago</text>
    </g>

    <!-- Feed Card 2 -->
    <g transform="translate(0, 98)">
      <rect width="350" height="64" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <circle cx="28" cy="32" r="15" fill="#3B82F6" fill-opacity="0.15"/>
      <path d="M23 32 H33 M29 28 L33 32 L29 36" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="26" fill="#F9FAFB" font-family="sans-serif" font-size="13" font-weight="700">Dispatched · Nexus Tech Park</text>
      <text x="52" y="45" fill="#9CA3AF" font-family="sans-serif" font-size="11">Driver: Karthik · 25 Cans En Route</text>
      <text x="330" y="26" text-anchor="end" fill="#6B7280" font-family="sans-serif" font-size="10">8m ago</text>
    </g>

    <!-- Feed Card 3 -->
    <g transform="translate(0, 172)">
      <rect width="350" height="64" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <circle cx="28" cy="32" r="15" fill="#F59E0B" fill-opacity="0.15"/>
      <path d="M28 26 V34 M28 38 V39" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="26" fill="#F9FAFB" font-family="sans-serif" font-size="13" font-weight="700">Stock Arrival · Central Bottling</text>
      <text x="52" y="45" fill="#9CA3AF" font-family="sans-serif" font-size="11">+150 Full Cans Added to Main Hub</text>
      <text x="330" y="26" text-anchor="end" fill="#6B7280" font-family="sans-serif" font-size="10">24m ago</text>
    </g>
  </g>

  <!-- Bottom App Navigation Bar -->
  <g transform="translate(16, 750)">
    <rect width="358" height="66" rx="24" fill="#0B101B" stroke="#1F2937" stroke-width="1.5"/>
    
    <!-- Tab 1 (Active) -->
    <g transform="translate(36, 12)">
      <rect x="-10" y="2" width="46" height="30" rx="15" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="13" cy="14" r="5" fill="#10B981"/>
      <text x="13" y="42" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700">Home</text>
    </g>

    <!-- Tab 2: Stock -->
    <g transform="translate(112, 12)">
      <path d="M7 10 L15 6 L23 10 L15 14 Z" stroke="#6B7280" stroke-width="1.5"/>
      <path d="M7 14 L15 18 L23 14" stroke="#6B7280" stroke-width="1.5"/>
      <text x="15" y="42" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" font-weight="600">Stock</text>
    </g>

    <!-- Tab 3: Deliveries -->
    <g transform="translate(196, 12)">
      <rect x="7" y="10" width="16" height="12" rx="3" stroke="#6B7280" stroke-width="1.5"/>
      <path d="M12 6 H18" stroke="#6B7280" stroke-width="1.5"/>
      <text x="15" y="42" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" font-weight="600">Routes</text>
    </g>

    <!-- Tab 4: Billing -->
    <g transform="translate(280, 12)">
      <rect x="7" y="8" width="16" height="15" rx="3" stroke="#6B7280" stroke-width="1.5"/>
      <path d="M11 14 H19" stroke="#6B7280" stroke-width="1.5"/>
      <text x="15" y="42" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" font-weight="600">Billing</text>
    </g>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="135" y="830" width="120" height="4" rx="2" fill="#4B5563"/>

  <defs>
    <linearGradient id="heroRevenueGrad" x1="0" y1="0" x2="350" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#082A24"/>
    </linearGradient>
  </defs>
</svg>
