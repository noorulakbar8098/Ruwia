    <text x="36" y="44" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="800">AF</text>
    
    <text x="68" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Apex Fitness Studio</text>
    <text x="68" y="52" fill="#9CA3AF" font-family="sans-serif" font-size="11">Commercial Acct · Ph: +91 98450 12345</text>
    
