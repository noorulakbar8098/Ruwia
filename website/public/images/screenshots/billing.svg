<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#090D16"/>
  
  <!-- Status Bar -->
  <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(320, 26)">
    <rect x="0" y="8" width="3" height="4" rx="1" fill="#F8FAFC"/>
    <rect x="5" y="6" width="3" height="6" rx="1" fill="#F8FAFC"/>
    <rect x="10" y="4" width="3" height="8" rx="1" fill="#F8FAFC"/>
    <rect x="15" y="1" width="3" height="11" rx="1" fill="#F8FAFC"/>
    <rect x="24" y="2" width="20" height="10" rx="3" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#10B981"/>
