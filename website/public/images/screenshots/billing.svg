      <rect x="7" y="8" width="16" height="15" rx="3" stroke="#10B981" stroke-width="1.8"/>
      <text x="15" y="42" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700">Billing</text>
    </g>
